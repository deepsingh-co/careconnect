version: '3.8'

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - '27017:27017'

  server:
    build:
      context: ./server
      dockerfile: ../Dockerfile.server
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/careconnect
      - JWT_SECRET=${JWT_SECRET:-change_me_in_production}
      - CLIENT_URL=http://localhost:3000
    ports:
      - '5000:5000'

  client:
    build:
      context: ./client
      dockerfile: ../Dockerfile.client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '3000:80'

volumes:
  mongo_data:
