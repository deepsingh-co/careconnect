# Render Blueprint — deploys CareConnect API + Web in one click.
# Full instructions: see WHATSAPP_SETUP.md in the repo root.
services:
  - type: web
    name: careconnect-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # MongoDB Atlas connection string (mongodb+srv://...)
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false # e.g. https://careconnect-web.onrender.com
      - key: WHATSAPP_PROVIDER
        value: meta
      - key: META_WHATSAPP_TOKEN
        sync: false
      - key: META_WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: META_WHATSAPP_WEBHOOK_VERIFY_TOKEN
        generateValue: true
      - key: META_WHATSAPP_APP_SECRET
        sync: false
      - key: META_WHATSAPP_OTP_TEMPLATE
        value: otp_verification
      - key: META_WHATSAPP_OTP_TEMPLATE_LANG
        value: en_US
      - key: META_WHATSAPP_OTP_TEMPLATE_BUTTON
        value: "false"

  - type: web
    name: careconnect-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # e.g. https://careconnect-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
